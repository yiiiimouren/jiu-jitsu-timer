
<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>柔術計時器</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div id="displayPanel">
        <h1>Timer</h1>
        <h2 id="phase">訓練時間</h2>
        <div id="timer">05:00</div>
    </div>

    <div id="settings">
        <div>
            <h3>訓練時間</h3>
            <input id="workMin" type="number" min="0" max="99" value="5"> 分
            <input id="workSec" type="number" min="0" max="59" value="0"> 秒
        </div>

        <div>
            <h3>休息時間</h3>
            <input id="restMin" type="number" min="0" max="99" value="0"> 分
            <input id="restSec" type="number" min="0" max="59" value="30"> 秒
        </div>
    </div>

    <button id="startBtn">開始</button>
    <button id="resetBtn">重設</button>

    <script src="script.js"></script>
</body>
</html>
